<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DragonClaw</title>
    <style>
      :root {
        color: #0c0a09;
        background:
          radial-gradient(circle at 50% 20%, rgba(168, 200, 232, 0.14), transparent 30%),
          radial-gradient(circle at 22% 18%, rgba(167, 229, 211, 0.22), transparent 32%),
          radial-gradient(circle at 78% 72%, rgba(200, 184, 224, 0.12), transparent 24%),
          linear-gradient(180deg, rgba(251, 250, 248, 0.99) 0%, rgba(245, 245, 245, 0.98) 100%);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      html,
      body,
      #root {
        height: 100%;
        min-height: 100vh;
      }

      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 20%, rgba(168, 200, 232, 0.14), transparent 30%),
          radial-gradient(circle at 22% 18%, rgba(167, 229, 211, 0.22), transparent 32%),
          radial-gradient(circle at 78% 72%, rgba(200, 184, 224, 0.12), transparent 24%),
          linear-gradient(180deg, rgba(251, 250, 248, 0.99) 0%, rgba(245, 245, 245, 0.98) 100%);
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 20%, rgba(168, 200, 232, 0.14), transparent 30%),
          radial-gradient(circle at 22% 18%, rgba(167, 229, 211, 0.22), transparent 32%),
          radial-gradient(circle at 78% 72%, rgba(200, 184, 224, 0.12), transparent 24%),
          linear-gradient(180deg, rgba(251, 250, 248, 0.99) 0%, rgba(245, 245, 245, 0.98) 100%);
        transition: opacity 220ms ease, transform 220ms ease;
      }

      #boot-splash::before,
      #boot-splash::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        pointer-events: none;
        filter: blur(48px);
        opacity: 0.95;
      }

      #boot-splash::before {
        top: 8%;
        left: 10%;
        width: min(42vw, 560px);
        height: min(26vw, 320px);
        background: radial-gradient(circle, rgba(244, 197, 168, 0.2) 0%, rgba(244, 197, 168, 0) 72%);
        animation: boot-splash-drift-left 14s ease-in-out infinite alternate;
      }

      #boot-splash::after {
        right: 6%;
        bottom: 8%;
        width: min(38vw, 520px);
        height: min(24vw, 300px);
        background: radial-gradient(circle, rgba(232, 184, 196, 0.14) 0%, rgba(232, 184, 196, 0) 74%);
        animation: boot-splash-drift-right 16s ease-in-out infinite alternate;
      }

      #boot-splash.is-leaving {
        opacity: 0;
        transform: scale(1.015);
        pointer-events: none;
      }

      .boot-splash__shell {
        position: relative;
        z-index: 1;
        width: min(100%, 420px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
      }

      .boot-splash__eyebrow {
        color: rgba(119, 113, 105, 0.92);
        font-size: 11px;
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: 0.18em;
      }

      .boot-splash__stage {
        width: 200px;
        height: 200px;
        display: grid;
        place-items: center;
        border-radius: 36px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(250, 249, 247, 0.96) 100%);
        border: 1px solid rgba(214, 211, 209, 0.88);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.92),
          0 20px 44px rgba(12, 10, 9, 0.08);
      }

      .boot-splash__logo {
        width: 148px;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 14px 24px rgba(12, 10, 9, 0.06));
      }

      .boot-splash__progress {
        width: 128px;
        height: 8px;
        margin-top: 2px;
        padding: 1px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(214, 211, 208, 0.82);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.64);
      }

      .boot-splash__progress-fill {
        height: 100%;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(41, 37, 36, 0.82), rgba(119, 113, 105, 0.78));
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18);
        background-size: 180% 100%;
        animation: boot-splash-shimmer 2.4s linear infinite;
      }

      .boot-splash__subtitle {
        margin: 0;
        max-width: 24ch;
        color: rgba(119, 113, 105, 0.9);
        font-size: 13px;
        line-height: 1.55;
      }

      .boot-splash__version {
        position: absolute;
        right: 22px;
        bottom: 16px;
        z-index: 1;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: rgba(119, 113, 105, 0.72);
      }

      @media (max-width: 480px) {
        .boot-splash__stage {
          width: 176px;
          height: 176px;
          border-radius: 30px;
        }

        .boot-splash__logo {
          width: 132px;
        }
      }

      @keyframes boot-splash-shimmer {
        0% {
          background-position: -180% center;
        }

        100% {
          background-position: 180% center;
        }
      }

      @keyframes boot-splash-drift-left {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }

        100% {
          transform: translate3d(42px, 18px, 0) scale(1.08);
        }
      }

      @keyframes boot-splash-drift-right {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }

        100% {
          transform: translate3d(-38px, -16px, 0) scale(1.06);
        }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-splash__shell">
        <div class="boot-splash__stage">
          <img class="boot-splash__logo" src="/src/assets/dragonclaw-logo.png" alt="DragonClaw" />
        </div>
        <div class="boot-splash__eyebrow">DRAGONCLAW</div>
        <div class="boot-splash__progress" aria-hidden="true">
          <div class="boot-splash__progress-fill"></div>
        </div>
        <p class="boot-splash__subtitle">正在准备启动界面与工作台，请稍候。</p>
      </div>
      <div class="boot-splash__version">Booting...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
